[project]
name = "gearboxdatamodel"
version = "0.1.0"
description = "Gearbox SQL Data Model"
authors = [{ name = "CTDS UChicago", email = "cdis@uchicago.edu" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.11,<3.0",
    "cdislogging>=1.0,<2.0",
    "SQLAlchemy>=2.0.43,<3.0",
    "fastapi>=0.115.12,<0.116.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
